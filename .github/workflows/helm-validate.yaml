name: Helm Validate

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "infrastructure/**"
      - ".github/workflows/helm-validate.yaml"

  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - "infrastructure/**"
      - ".github/workflows/helm-validate.yaml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-validate:
    name: Validate All Helm Charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Validate Helm Charts
        shell: bash
        run: |
          set -euo pipefail

          for chart in charts/* infrastructure/*; do
            [ -f "$chart/Chart.yaml" ] || continue

            echo "================================"
            echo "Validating: $chart"
            echo "================================"

            helm lint "$chart" \
              -f "$chart/values-dev.yaml"

            helm template "$(basename "$chart")" "$chart" \
              --namespace chat-app-dev \
              -f "$chart/values-dev.yaml" \
              > /dev/null

            helm lint "$chart" \
              -f "$chart/values-prod.yaml"

            helm template "$(basename "$chart")" "$chart" \
              --namespace chat-app-prod \
              -f "$chart/values-prod.yaml" \
              > /dev/null
          done

          echo "All Helm charts validated successfully!"